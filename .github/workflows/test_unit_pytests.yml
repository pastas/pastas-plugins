name: CI PYTEST

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  # Group by workflow name and ref (branch or pull request ref).
  # For pushes the ref is the branch (refs/heads/<branch>).
  # For PR events the ref is refs/pull/<number>/merge — same across commits for that PR.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test suite for modflow plugin with py311-ubuntu
            python: "3.11"
            toxenv: modflow
          - name: Test suite for modflow plugin with py314-ubuntu
            python: "3.14"
            toxenv: modflow
          - name: Test suite for responses plugin with py311-ubuntu
            python: "3.11"
            toxenv: responses
          - name: Test suite for responses plugin with py314-ubuntu
            python: "3.14"
            toxenv: responses
          - name: Test suite for reservoirs plugin with py311-ubuntu
            python: "3.11"
            toxenv: reservoirs
          - name: Test suite for reservoirs plugin with py314-ubuntu
            python: "3.14"
            toxenv: reservoirs
          - name: Test suite for cross_correlation plugin with py311-ubuntu
            python: "3.11"
            toxenv: cross_correlation
          - name: Test suite for cross_correlation plugin with py314-ubuntu
            python: "3.14"
            toxenv: cross_correlation
          - name: Test suite for rml_solver plugin with py311-ubuntu
            python: "3.11"
            toxenv: rml_solver
          - name: Test suite for rml_solver plugin with py314-ubuntu
            python: "3.14"
            toxenv: rml_solver
          - name: Test suite for dataworth plugin with py311-ubuntu
            python: "3.11"
            toxenv: dataworth
          - name: Test suite for dataworth plugin with py314-ubuntu
            python: "3.14"
            toxenv: dataworth
          - name: Test suite for all unit tests
            python: "3.14"
            toxenv: all
    env:
      # Color Output
      # Rich (pip)
      FORCE_COLOR: 1
      # Tox
      PY_COLORS: 1
      # Pytest
      PYTEST_ADDOPTS: "--color=yes"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Setup tox environment
        run: tox -e ${{ matrix.toxenv }} --notest

      - name: Test
        run: tox -e ${{ matrix.toxenv }} --skip-pkg-install

      # - name: Run codacy-coverage-reporter
      #   if: ${{ matrix.toxenv == 'all' && github.repository == 'pastas/pastas-plugins' && success() }}
      #   uses: codacy/codacy-coverage-reporter-action@master
      #   with:
      #     project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
      #     coverage-reports: coverage.xml
